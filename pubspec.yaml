name: loanready_app
description: A loan readiness and document management application.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Icons ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.1.1

  # ── State Management ────────────────────────────────────────
  provider: ^6.1.5+1

  # ── Firebase ────────────────────────────────────────────────
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2

  # ── Networking ──────────────────────────────────────────────
  http: ^1.5.0

  # ── File Handling & Storage ─────────────────────────────────
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  excel: ^4.0.6

  # ── PDF & Documents ─────────────────────────────────────────
  syncfusion_flutter_pdf: ^31.2.18
  syncfusion_flutter_pdfviewer: ^31.2.18
  pdf: ^3.12.0
  printing: ^5.14.3
  open_file: ^3.5.10

  # ── ML & OCR ────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.15.0

  # ── Payments ────────────────────────────────────────────────
  razorpay_flutter: ^1.4.0

  # ── Utilities ───────────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/7985578.png